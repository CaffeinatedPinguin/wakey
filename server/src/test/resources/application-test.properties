# Shared plans and defaults for the integration tests. The neutral "default" plan keeps an
# ordinary test space unrestricted; tests that need a plan assign it to their own space.
wakey.plans.default.default=true
wakey.plans.limited.min-interval=30
wakey.plans.limited.max-timeout=20
wakey.plans.limited.max-retries=3
wakey.plans.limited.max-checks=2
wakey.plans.small.min-interval=30
wakey.plans.small.max-timeout=20
wakey.plans.small.max-retries=3
wakey.plans.small.max-checks=10
wakey.plans.large.min-interval=5
wakey.plans.large.max-timeout=120
wakey.plans.large.max-retries=10
wakey.plans.large.max-checks=100
wakey.plans.open.max-checks=50
wakey.defaults.timezone=Europe/Warsaw

# Behaviour every integration test shares, so no test needs its own property source for it.
# The PostgreSQL session limits and the admin group are safe for the whole run; the API docs are
# served in tests only and are switched off again by the one test that checks the production default.
wakey.database.idle-in-transaction-timeout=45s
wakey.database.lock-timeout=3s
wakey.security.admin-group=wakey-admins
springdoc.api-docs.enabled=true
# The consumer tests drive the loop explicitly; no background thread competes for the same topic.
wakey.checks.consumer.enabled=false
# The scheduler tests drive the loop explicitly; no background thread runs checks in the shared context.
wakey.checks.scheduler.enabled=false
