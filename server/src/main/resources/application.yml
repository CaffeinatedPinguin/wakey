server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: wakey-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:hsqldb:file:./data/wakey;shutdown=true
    username: sa
    password: ""
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

wakey:
  database:
    idle-in-transaction-timeout: 60s
    lock-timeout: 5s
  leadership:
    holder-id: ${random.uuid}
    ttl: 30s
  security:
    admin-claim: groups
    admin-group: ""
    frontend-url: /
    session-max-age: 12h

logging:
  level:
    dev.wakey.security: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: healthz
