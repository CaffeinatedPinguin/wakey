server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: wakey-server
  threads:
    virtual:
      enabled: true
  # The operator supplies the PostgreSQL connection through SPRING_DATASOURCE_URL,
  # SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  datasource:
    hikari:
      # postgres-only: both are PostgreSQL server settings applied through set_config on every new
      # connection, so every pooled session has the limits even if the server sets them differently.
      connection-init-sql: "SELECT set_config('idle_in_transaction_session_timeout', '60s', false), set_config('lock_timeout', '5s', false)"
springdoc:
  # The API description is a repository artifact generated by the tests, never served in production.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  override-with-generic-response: false

wakey:
  api:
    default-page-size: 20
    max-page-size: 100
  # The instance default of every setting; these are the only values, written once in this file.
  # An operator overrides them through the WAKEY_DEFAULTS_* environment variables.
  defaults:
    timezone: UTC
    language: pl
    check:
      interval: 60
      timeout: 10
      retries: 1
  leadership:
    holder-id: ${random.uuid}
    ttl: 30s
  security:
    admin-claim: groups
    admin-group: ""
    frontend-url: /
    session-max-age: 12h

logging:
  pattern:
    # Local text output: the Boot default format with the message passed through Logback's
    # %replace so control and line/paragraph separators cannot start a second log line.
    # The exception stack trace stays multi-line on purpose.
    console: |-
      %clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}){} %clr(${PID:}){magenta} %clr(--- %esb(){APPLICATION_NAME}%esb{APPLICATION_GROUP}[%15.15t] ${LOG_CORRELATION_PATTERN:}){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m){'[\p{Cntrl}\x{2028}\x{2029}\x{202A}-\x{202E}\x{2066}-\x{2069}]', '?'}%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}
  level:
    dev.wakey.security: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: healthz
